name: Build Nexterm Multi-Platform

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  build-windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Run Tests
        run: go test -v ./...

      - name: Build Windows Binary
        run: wails build -platform windows/amd64 -clean

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexterm-windows-amd64
          path: build/bin/*.exe

  build-macos-arm64:
    name: macOS Apple Silicon (arm64)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build macOS App Bundle
        run: wails build -platform darwin/arm64 -clean

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexterm-macos-arm64
          path: build/bin/*.app

  build-linux-amd64:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Linux Binary
        run: wails build -platform linux/amd64 -clean

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexterm-linux-amd64
          path: build/bin/nexterm
